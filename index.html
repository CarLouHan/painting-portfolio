    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
      <button class="lightbox-prev" aria-label="Previous image">&#10094;</button>
      <button class="lightbox-next" aria-label="Next image">&#10095;</button>
      <img class="lightbox-content" id="lightbox-img" alt="">
    </div>

    <script>
      document.getElementById('currentYear').textContent = new Date().getFullYear();

      // Lightbox functionality
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const closeBtn = document.querySelector('.lightbox-close');
      const prevBtn = document.querySelector('.lightbox-prev');
      const nextBtn = document.querySelector('.lightbox-next');
      
      const images = Array.from(document.querySelectorAll('.container figure a'));
      let currentIndex = 0;
      let lastFocusedElement = null;

      images.forEach((link, index) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          currentIndex = index;
          showLightbox(link.href);
        });
      });

      function showLightbox(src) {
        lastFocusedElement = document.activeElement;
        lightboxImg.src = src;
        lightboxImg.alt = images[currentIndex].querySelector('img').alt;
        lightbox.style.display = 'flex';
        closeBtn.focus();
      }

      function closeLightbox() {
        lightbox.style.display = 'none';
        if (lastFocusedElement) {
          lastFocusedElement.focus();
        }
      }

      function showNext() {
        currentIndex = (currentIndex + 1) % images.length;
        lightboxImg.src = images[currentIndex].href;
        lightboxImg.alt = images[currentIndex].querySelector('img').alt;
      }

      function showPrev() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        lightboxImg.src = images[currentIndex].href;
        lightboxImg.alt = images[currentIndex].querySelector('img').alt;
      }

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeLightbox();
      });
      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showNext();
      });
      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showPrev();
      });
      
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex') {
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowRight') showNext();
          if (e.key === 'ArrowLeft') showPrev();
        }
      });
    </script>
